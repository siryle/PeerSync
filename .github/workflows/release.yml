name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A release created by this workflow pushes tag vX.Y.Z. Skip that follow-up
# run so one commit is not built twice.
permissions:
  contents: read

concurrency:
  group: peersync-release
  cancel-in-progress: false

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check a version tag matches version.go
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^const Current /{print $2; exit}' internal/version/version.go)
          test "$GITHUB_REF_NAME" = "v${VERSION}"
      - run: go test ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Image tags
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^const Current /{print $2; exit}' internal/version/version.go)
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          SHA="sha-${GITHUB_SHA::12}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "server=ghcr.io/${OWNER}/peersync-server" >> "$GITHUB_OUTPUT"
          echo "client=ghcr.io/${OWNER}/peersync" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish discovery server image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.server }}:latest
            ${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=peersync-server
          cache-from: type=gha,scope=peersync-server
          cache-to: type=gha,mode=max,scope=peersync-server
      - name: Publish sync client image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.client }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.client }}:latest
            ${{ steps.meta.outputs.client }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=peersync
          cache-from: type=gha,scope=peersync-client
          cache-to: type=gha,mode=max,scope=peersync-client

  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build windowed Windows clients
        run: make windows-gui
      - name: Name release files
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^const Current /{print $2; exit}' internal/version/version.go)
          mkdir -p dist
          cp bin/PeerSync-windows-amd64.exe "dist/PeerSync-${VERSION}-windows-amd64.exe"
          cp bin/PeerSync-windows-arm64.exe "dist/PeerSync-${VERSION}-windows-arm64.exe"
          test "$(stat -c%s "dist/PeerSync-${VERSION}-windows-amd64.exe")" -gt 1000000
          test "$(stat -c%s "dist/PeerSync-${VERSION}-windows-arm64.exe")" -gt 1000000
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: dist/PeerSync-*-windows-*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build universal macOS disk image
        run: make dmg-universal
      - name: Check the disk image
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^const Current /{print $2; exit}' internal/version/version.go)
          DMG="build/PeerSync-${VERSION}-macos.dmg"
          test -s "$DMG"
          lipo -info build/PeerSync.app/Contents/MacOS/PeerSync | grep -q x86_64
          lipo -info build/PeerSync.app/Contents/MacOS/PeerSync | grep -q arm64
          hdiutil verify "$DMG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos
          path: build/PeerSync-*-macos.dmg
          if-no-files-found: error

  release:
    needs: [images, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^const Current /{print $2; exit}' internal/version/version.go)
          BUILDN=$(awk -F'"' '/^const Build /{print $2; exit}' internal/version/version.go)
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="v${VERSION}"
          mkdir -p release
          find dist -type f \( -name 'PeerSync-*-macos.dmg' -o -name 'PeerSync-*-windows-*.exe' \) -exec cp {} release/ \;
          cd release
          test -s "PeerSync-${VERSION}-macos.dmg"
          test -s "PeerSync-${VERSION}-windows-amd64.exe"
          test -s "PeerSync-${VERSION}-windows-arm64.exe"
          sha256sum PeerSync-* > SHA256SUMS.txt
          cat > NOTES.md <<EOF
          PeerSync ${VERSION}（build ${BUILDN}）

          macOS
          - \`PeerSync-${VERSION}-macos.dmg\`：一个磁盘映像里同时有 Apple 芯片和 Intel。
          - 第一次打开若被系统拦截，在 Finder 里对该应用右键，选择「打开」。

          Windows
          - \`PeerSync-${VERSION}-windows-amd64.exe\`
          - \`PeerSync-${VERSION}-windows-arm64.exe\`
          - 窗口使用 WebView2。Windows 11 已自带。

          容器镜像在 GitHub Packages：
          - \`ghcr.io/${OWNER}/peersync-server:${VERSION}\`
          - \`ghcr.io/${OWNER}/peersync:${VERSION}\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "PeerSync ${VERSION}" --notes-file NOTES.md --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "PeerSync ${VERSION}" --notes-file NOTES.md --latest
          fi
          gh release upload "$TAG" PeerSync-* SHA256SUMS.txt --clobber
